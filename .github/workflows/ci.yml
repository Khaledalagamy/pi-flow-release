name: Check sealed-release helpers
on:
  pull_request:
  push:
    branches: [main, feat/sealed-tool-release]
permissions:
  contents: read
jobs:
  workflow-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ruby tests/verify-workflows.rb
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Format, tamper, and boundary tests
        run: dotnet run --project tests/Seal.Tests -c Release -p:RestoreLockedMode=true
      - name: Parse PowerShell and exercise leak checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem actions -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { throw 'PowerShell parse failure.' }
          }
          $out = New-Item -ItemType Directory "$env:RUNNER_TEMP/leak-fixture"
          Set-Content "$out/Tool.dll" 'test bytes, never uploaded'
          ./actions/leak-check/check.ps1 -DllPath "$out/Tool.dll"
          Set-Content "$out/leak.pdb" 'unexpected file'
          $refused = $false
          try { ./actions/leak-check/check.ps1 -DllPath "$out/Tool.dll" } catch { $refused = $true }
          if (-not $refused) { throw 'Leak check accepted extra files.' }
      - name: Build helpers from locked dependencies
        run: |
          dotnet restore actions/seal/Seal.csproj --locked-mode
          dotnet build actions/seal/Seal.csproj -c Release --no-restore
          dotnet restore actions/contract-check/CheckContract.csproj --locked-mode
          dotnet build actions/contract-check/CheckContract.csproj -c Release --no-restore
      - name: Rehearse the actual build and seal without publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = "$env:GITHUB_WORKSPACE/actions/build.ps1"
          $fixture = "$env:RUNNER_TEMP/tool-fixture"
          New-Item -ItemType Directory $fixture | Out-Null
          Copy-Item tests/Fixture/* $fixture
          $env:GITHUB_WORKSPACE = $fixture
          $env:GITHUB_REF = 'refs/tags/v1.2.0-alpha.1'
          $env:GITHUB_OUTPUT = "$env:RUNNER_TEMP/rehearsal-output"
          & $helper -Project Fixture.csproj
          $sealed = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP/release.pfs")
          if ([Text.Encoding]::ASCII.GetString($sealed[0..3]) -ne 'PFS1') { throw 'Rehearsal did not produce PFS1.' }
          if ((Get-Content $env:GITHUB_OUTPUT -Raw) -notmatch 'sealed_sha256=[a-f0-9]{64}') { throw 'Missing sealed digest.' }
          if (-not (Get-Content "$env:RUNNER_TEMP/piflow-nuget.config" -Raw).Contains('<packageSource key="piflow"><package pattern="PiFlow.*" /></packageSource>')) { throw 'PiFlow.* is not mapped to the piflow feed.' }
          Remove-Item "$env:RUNNER_TEMP/release.pfs"
      - name: Refuse manifests the release API refuses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = "$env:RUNNER_TEMP/tool-fixture"
          $dll = (dotnet msbuild "$fixture/Fixture.csproj" -getProperty:TargetPath -p:Configuration=Release).Trim()
          $good = Get-Content "$fixture/piflow-tool.json" -Raw
          $cases = [ordered]@{
            manifest_fields = $good.Replace('"isMcpTool":false', '"isMcpTool":false,"envKey":"X"')
            manifest_name = $good.Replace('"Fixture Tool"', '"' + ('N' * 37) + '"')
            manifest_description = $good.Replace('rehearsal."', 'rehearsal"')
            manifest_entry = $good.Replace('"Execute"', '"Run"')
            manifest_mcp = $good.Replace('"isMcpTool":false', '"isMcpTool":true')
          }
          foreach ($rule in $cases.Keys) {
            if ($cases[$rule] -eq $good) { throw "The $rule case did not change the manifest." }
            $path = "$env:RUNNER_TEMP/manifest-$rule.json"
            Set-Content -LiteralPath $path -Value $cases[$rule] -NoNewline
            $report = dotnet run --project actions/contract-check/CheckContract.csproj -c Release --no-build -- $dll --manifest $path
            if (-not $LASTEXITCODE -or -not ($report -like "FAIL *($rule)*")) { throw "The contract check accepted a manifest the release API refuses with $rule." }
          }
          # Each case's expected failure leaves LASTEXITCODE set, and the runner exits with it.
          $global:LASTEXITCODE = 0
